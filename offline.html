<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – Morouj Plant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #133E33;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
    p  { color: #a7c4bc; margin-bottom: 1.5rem; max-width: 340px; line-height: 1.6; }
    button {
      background: #F15A24;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #D44413; }
  </style>
</head>
<body>
  <div class="icon">🌐</div>
  <h1>You are offline</h1>
  <p>No internet connection detected. Please check your network and try again.</p>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
